name: Sync Data to R2 and Purge Cache

on:
  workflow_dispatch: 
  schedule:
    # 09:15 UTC is 06:15 AM in Sao Paulo (UTC-3)
    - cron: '15 9 * * *'

jobs:
  sync-to-r2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS/R2 Credentials and Concurrency
        run: |
          aws configure set aws_access_key_id ${{ secrets.R2_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws configure set default.region auto
          
          # Maximize parallel uploading threads for thousands of small files
          aws configure set default.s3.max_concurrent_requests 50
          aws configure set default.s3.max_queue_size 10000

      - name: Sync Schedules to R2 Main Folder
        # Syncs the local schedule folder to a schedule folder in the bucket root
        run: |
          aws s3 sync ./schedule s3://programacaotvhoje/schedule \
            --endpoint-url https://c222653e18e0baf276756cd9bcdfe36c.r2.cloudflarestorage.com \
            --delete \
            --no-progress

      - name: Sync Images to R2 wp-content/uploads
        # Syncs the local downloaded-images folder into the wp-content/uploads directory
        run: |
          aws s3 sync ./downloaded-images s3://programacaotvhoje/wp-content/uploads/downloaded-images \
            --endpoint-url https://c222653e18e0baf276756cd9bcdfe36c.r2.cloudflarestorage.com \
            --delete \
            --no-progress

      - name: Purge Cloudflare Cache
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
          -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
          -H "Content-Type: application/json" \
          --data '{"purge_everything":true}'
