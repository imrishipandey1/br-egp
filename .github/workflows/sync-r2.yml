name: Sync Data to R2 and Purge Cache

on:
  workflow_dispatch: 
  schedule:
    # 09:15 UTC is 06:15 AM in Sao Paulo (UTC-3)
    - cron: '15 9 * * *'

jobs:
  sync-to-r2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone for Cloudflare R2
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint = https://c222653e18e0baf276756cd9bcdfe36c.r2.cloudflarestorage.com
          acl = private
          EOF

      - name: Sync Schedules to R2 Main Folder
        run: |
          rclone sync ./schedule r2:programacaotvhoje/schedule \
          --transfers=128 \
          --checkers=256 \
          --fast-list \
          --delete-during \
          --s3-no-check-bucket \
          --checksum \
          --no-update-modtime

      - name: Sync Images to R2 wp-content/uploads
        run: |
          rclone sync ./downloaded-images r2:programacaotvhoje/wp-content/uploads/downloaded-images \
          --transfers=128 \
          --checkers=256 \
          --fast-list \
          --delete-during \
          --s3-no-check-bucket \
          --checksum \
          --no-update-modtime

      - name: Purge Cloudflare Cache
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
          -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
          -H "Content-Type: application/json" \
          --data '{"purge_everything":true}'
